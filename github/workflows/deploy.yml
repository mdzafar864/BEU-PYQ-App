name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Fail early on a syntax error instead of publishing a broken app.
      - name: Check JavaScript syntax
        run: |
          for f in js/*.js service-worker.js scripts/build-sw.js; do
            node --check "$f"
          done

      # version.json "version" is edited BY HAND for a real app release.
      # Only a changed "version" shows the "New version available" popup.
      # A normal deploy (e.g. new links in js/data.js) keeps the version and
      # shows the "New PYQ added" popup instead. Do NOT use --bump here:
      # nothing is committed back, so it would produce the same number every run.
      - name: Check version.json
        run: |
          node -e '
            const v = JSON.parse(require("fs").readFileSync("version.json", "utf8")).version;
            if (!/^\d+\.\d+\.\d+$/.test(v)) {
              console.error("version.json: \"version\" must look like 1.0.3, got: " + v);
              process.exit(1);
            }
            console.log("App version:", v);
          '

      # Stamps a fresh BUILD_ID and the APP_VERSION (from version.json) into
      # service-worker.js, and the build id into version.json
      # (only in the deployed copy; nothing is committed back to the repo).
      - name: Stamp build id and app version
        run: node scripts/build-sw.js

      # Make sure the stamped service worker and version.json agree, otherwise
      # users would get a "new version" popup on every visit.
      - name: Verify stamped files
        run: |
          node -e '
            const fs = require("fs");
            const info = JSON.parse(fs.readFileSync("version.json", "utf8"));
            const sw = fs.readFileSync("service-worker.js", "utf8");
            const ver = (sw.match(/const APP_VERSION = "(.*)"; \/\/ @app-version/) || [])[1];
            const build = (sw.match(/const BUILD_ID = "(.*)"; \/\/ @build-id/) || [])[1];
            if (ver !== info.version || build !== info.build) {
              console.error("Mismatch:", { ver, build, info });
              process.exit(1);
            }
            console.log("OK:", info);
          '

      - name: Remove files that should not be published
        run: rm -rf scripts .github .git

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
